<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<defs>
  <linearGradient id="paper" x2="0" y2="1">
    <stop stop-color="#f5f0e6"/>
    <stop offset="1" stop-color="#ddd4c3"/>
  </linearGradient>
  <filter id="shadow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<rect width="1000" height="1000" fill="#050505"/>

<!-- map panels -->
<g fill="url(#paper)">
  <path d="M270 270 L500 390 L500 760 L270 650 Z"/>
  <path d="M500 390 L730 270 L730 650 L500 760 Z"/>
</g>

<!-- map fold lines -->
<g fill="none" stroke="#222" stroke-width="3" opacity=".65" stroke-dasharray="16 14">
  <path d="M300 360 C370 300 430 350 470 310"/>
  <path d="M300 520 C390 470 410 430 470 420"/>
  <path d="M530 360 C610 300 680 340 720 300"/>
  <path d="M540 540 C620 500 670 450 720 420"/>
</g>

<!-- wolf silhouette -->
<path fill="#050505" d="
M430 470
L430 370 L520 300
L590 390
L650 410
L720 500
L650 540
L610 540
L560 650
L500 650
L500 530
Z"/>

