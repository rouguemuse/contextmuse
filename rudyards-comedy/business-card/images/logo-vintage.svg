<svg width="800" height="800" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&amp;family=Bodoni+Moda:ital,wght@1,900&amp;family=Outfit:wght@400;700&amp;display=swap');
      .logo-text-main { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; }
      .logo-text-serif { font-family: 'Bodoni Moda', serif; font-weight: 900; font-style: italic; text-transform: uppercase; }
      .logo-text-small { font-family: 'Outfit', sans-serif; font-weight: 400; text-transform: uppercase; }
    </style>
  </defs>
  
  <rect width="1000" height="1000" fill="transparent" />
  
  <g fill="#FFFFFF">
    <!-- BROAD SQUARE BORDER BOX -->
    <!-- Widened to 970px and height kept at 880px to maximize square footprint -->
    <path d="M 460 60 L 15 60 L 15 940 L 985 940 L 985 60 L 540 60" fill="none" stroke="#FFFFFF" stroke-width="4" />
    
    <!-- THE (Top center break) -->
    <text x="500" y="75" text-anchor="middle" class="logo-text-small" font-size="32" letter-spacing="12">THE</text>
    
    <!-- HOUSTON (Forced fit with textLength) -->
    <text x="500" y="240" text-anchor="middle" class="logo-text-serif" font-size="100" textLength="850" lengthAdjust="spacing">HOUSTON</text>
    
    <!-- MICROPHONE CENTERPIECE (Taller Vertical Profile) -->
    <g transform="translate(500, 470) scale(1.65)">
      <!-- Rays -->
      <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.9">
        <line x1="-35" y1="-25" x2="-80" y2="-50" />
        <line x1="-42" y1="-8" x2="-90" y2="-12" />
        <line x1="-45" y1="12" x2="-95" y2="12" />
        <line x1="-42" y1="32" x2="-90" y2="38" />
        <line x1="-35" y1="48" x2="-80" y2="72" />
        <line x1="35" y1="-25" x2="80" y2="-50" />
        <line x1="42" y1="-8" x2="90" y2="-12" />
        <line x1="45" y1="12" x2="95" y2="12" />
        <line x1="42" y1="32" x2="90" y2="38" />
        <line x1="35" y1="48" x2="80" y2="72" />
      </g>
      
      <!-- Stars -->
      <path d="M -135 15 l 3 -5 l 6 -1 l -4 -4 l 1 -6 l -6 3 l -6 -3 l 1 6 l -4 4 l 6 1 z" />
      <path d="M 135 15 l 3 -5 l 6 -1 l -4 -4 l 1 -6 l -6 3 l -6 -3 l 1 6 l -4 4 l 6 1 z" />
      
      <!-- Mic Head -->
      <path d="M -22 -35 Q -22 -48 0 -48 Q 22 -48 22 -35 L 22 25 Q 22 38 0 38 Q -22 38 -22 25 Z" fill="#FFFFFF" />
      <!-- Mic Grill -->
      <g stroke="#000000" stroke-width="1.2">
        <line x1="-22" y1="-15" x2="22" y2="-15" />
        <line x1="-20" y1="-2" x2="20" y2="-2" />
        <line x1="-20" y1="11" x2="20" y2="11" />
        <line x1="-22" y1="24" x2="22" y2="24" />
        <line x1="-12" y1="-48" x2="-12" y2="35" />
        <line x1="0" y1="-48" x2="0" y2="35" />
        <line x1="12" y1="-48" x2="12" y2="35" />
      </g>
      <!-- Mic Base -->
      <path d="M -6 38 l 0 16 l -16 16 l 44 0 l -16 -16 l 0 -16 z" fill="#FFFFFF" />
    </g>
    
    <!-- COMEDY CLUB (Forced fit with textLength to guarantee it stays inside box) -->
    <text x="500" y="740" text-anchor="middle" class="logo-text-main" font-size="120" textLength="900" lengthAdjust="spacing">COMEDY CLUB</text>
    
    <!-- SUB-DETAIL SECTION -->
    <g transform="translate(500, 860)">
      <line x1="-380" y1="0" x2="-45" y2="0" stroke="#FFFFFF" stroke-width="3" />
      <line x1="380" y1="0" x2="45" y2="0" stroke="#FFFFFF" stroke-width="3" />
      <path d="M 0 -12 l 3 7 l 8 1 l -6 6 l 2 8 l -7 -4 l -7 4 l 2 -8 l -6 -6 l 8 -1 z" />
      
      <!-- LOCATION -->
      <text y="75" text-anchor="middle" class="logo-text-small" font-size="38" letter-spacing="16">HOUSTON, TEXAS</text>
    </g>
  </g>
</svg>
