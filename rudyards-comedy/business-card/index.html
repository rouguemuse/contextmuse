<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Houston Comedy Club | Double-Sided Business Card</title>
    <link rel="stylesheet" href="card-styles.css">
</head>
<body class="two-sided-view">

    <div class="card-wrapper">
        <!-- SIDE 1: FRONT (MAJOR BRANDING) -->
        <div class="business-card front-face">
            <div class="card-interior logo-focus">
                <img src="images/logo-horizontal-heavy.svg" alt="The Houston Comedy Club Logo" class="logo-centerpiece title-logo">
            </div>
        </div>

        <!-- SIDE 2: BACK (INFORMATION) -->
        <div class="business-card back-face">
            <div class="card-interior info-layout">
                <div class="back-accent"></div>
                
                <header class="card-header">
                    <h1 class="brand-title">THE HOUSTON <br>COMEDY CLUB</h1>
                    <p class="brand-subtitle">A Better Room for Comedy</p>
                </header>

                <div class="info-columns">
                    <div class="info-col location">
                        <h2 class="section-label">Location</h2>
                        <address class="card-value">2020 Waugh Dr<br>Houston, TX 77006</address>
                        <p class="card-value phone">281.797.1396</p>
                    </div>

                    <div class="info-col connectivity">
                        <h2 class="section-label">Digital</h2>
                        <p class="card-value web">thehoustoncomedyclub.com</p>
                        <div class="email-stack">
                            <p class="email-entry"><span class="small-label">Info:</span> info@thehoustoncomedyclub.com</p>
                            <p class="email-entry"><span class="small-label">Book:</span> bookings@thehoustoncomedyclub.com</p>
                        </div>
                    </div>
                </div>

                <footer class="card-footer-branding">
                    <span class="location-stamp">Est. Houston, Texas</span>
                </footer>
            </div>
        </div>
    </div>

</body>
</html>
