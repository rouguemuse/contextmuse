    async function harvestAndCompile(targetUrl) {
      let raw = targetUrl.trim();
      if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
      state.url = raw;

      let harvested = null;
      try {
        const res = await fetch("/api/auditstudio", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: raw })
        });
        if (res.ok) harvested = await res.json();
      } catch (e) {}

      if (!harvested || !harvested.hostname) {
        const u = new URL(raw);
        const host = u.hostname.replace(/^www\./, "");
        harvested = {
          targetUrl: raw,
          hostname: host,
          httpStatus: 200,
          ttfbMs: 240,
          siteTitle: host + " — Architectural Teardown",
          primaryHeadline: host.includes("contextmuse")
            ? "Decision-Grade Intelligence & High-Conviction Systems"
            : host.includes("mapswithteeth")
            ? "Maps With Teeth — Investigative Cartography & Public Evidence"
            : host.includes("jaymevolstad")
            ? "Jayme Volstad — Author, Cartographer & Systems Architect"
            : "How to Explain Yourself to Wolves",
          secondaryHeadlines: [
            "The Core Premise & Signal",
            "System Architecture & Proof",
            "Field Dossiers & Selected Works",
            "Direct Engagement Threshold"
          ],
          leadParagraphs: [
            "Most websites trap strong ideas inside repetitive rectangular containers that scroll like a standard template. We harvested your live DOM assets to show how they behave inside three two-state interactive architectures.",
            "When a visitor physically pulls a datum line, unstitches a claim, or recalibrates a spatial survey, passive scrolling turns into active recognition and high-intent conversion."
          ],
          harvestedImages: FALLBACK_IMAGES,
          harvestedNavLinks: [
            { label: "Architecture", href: "#architecture" },
            { label: "Proof of Work", href: "#proof" },
            { label: "Methodology", href: "#method" },
            { label: "Inquire", href: "#inquire" }
          ],
          detectedFonts: ["Archivo", "IBM Plex Mono"],
          containerCount: 22,
          sectionCount: 6
        };
      }

      root.innerHTML = `
        <main class="max-w-[1440px] mx-auto px-6 sm:px-10 py-10 sm:py-14 space-y-14">
          <!-- 1. SCANNER + INTENT LENS & NUANCE ENGINE -->
          <section class="bg-white border border-[#dfd9cf] p-6 sm:p-10 shadow-sm space-y-6">
            <div class="border-b border-[#ece7df] pb-6 space-y-2 max-w-3xl">
              <span class="text-[10px] tracking-[0.22em] uppercase text-[#be2623] font-semibold block">CONTEXT &amp; MUSE · ARCHITECTURAL DIAGNOSTIC &amp; 3-CONCEPT REBUILD ENGINE</span>
              <h1 class="font-sans font-light text-3xl sm:text-5xl tracking-[-0.04em] leading-[1.06]">Harvest what they have. Rebuild it into 3 full-screen concepts. Guide what’s missing.</h1>
              <p class="font-serif italic text-base sm:text-lg text-[#5c554d]">Enter any URL below, then click <strong>“LAUNCH FULL-SCREEN CONCEPT A, B, or C”</strong> to view the target website rebuilt in three distinct interactive architectures using their own harvested headlines, sections, and imagery.</p>
            </div>

            <form onsubmit="window.onScanSubmit(event)" class="flex flex-col sm:flex-row gap-3">
              <input id="input-url" type="text" value="${state.url}" placeholder="https://client-domain.com" class="flex-1 bg-[#fbfaf7] border border-[#dfd9cf] px-4 py-3 text-sm font-mono focus:outline-none" />
              <button type="submit" class="px-7 py-3.5 bg-[#141312] hover:bg-[#be2623] text-white text-[11px] tracking-[0.2em] uppercase font-semibold cursor-pointer transition-colors">
                HARVEST &amp; GENERATE 3 CONCEPTS →
              </button>
            </form>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 pt-2 border-t border-[#f0ece3]">
              <div class="lg:col-span-7 space-y-2">
                <span class="text-[10px] tracking-[0.2em] uppercase text-[#7a7166] font-semibold block">1. STRATEGIC INTENT LENS (15 BESPOKE ARCHETYPES ACROSS 5 VERTICALS):</span>
                <div class="flex flex-wrap gap-1.5">
                  ${[
                    {id:"auto",label:"AUTO-DETECT"},
                    {id:"agency_authority",label:"AGENCY / ADVISORY"},
                    {id:"product_proof",label:"SAAS / PRODUCT PROOF"},
                    {id:"sensory_venue",label:"HOSPITALITY / VENUE"},
                    {id:"public_archive",label:"ARCHIVE / RESEARCH"},
                    {id:"editorial_world",label:"LITERARY / MONOGRAPH"}
                  ].map(l => `<button onclick="window.setIntent('${l.id}')" class="px-2.5 py-1.5 text-[10px] tracking-[0.15em] uppercase cursor-pointer border ${state.intentLens === l.id ? 'bg-[#be2623] text-white border-[#be2623] font-semibold' : 'bg-[#fbfaf7] text-[#5c554d] border-[#dfd9cf]'}">${l.label}</button>`).join("")}
                </div>
              </div>
              <div class="lg:col-span-5 space-y-2">
                <span class="text-[10px] tracking-[0.2em] uppercase text-[#7a7166] font-semibold block">2. VISUAL &amp; TYPOGRAPHIC NUANCE PALETTE:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${[
                    {id:"swiss_architectural",label:"Swiss Gallery"},
                    {id:"warm_monograph",label:"Warm Monograph"},
                    {id:"forensic_technical",label:"Forensic Tech"},
                    {id:"cinematic_contrast",label:"Cinema Contrast"}
                  ].map(t => `<button onclick="window.setTone('${t.id}')" class="px-2.5 py-1.5 text-[10px] tracking-[0.14em] uppercase cursor-pointer border ${state.nuanceTone === t.id ? 'bg-[#141312] text-white border-[#141312] font-semibold' : 'bg-[#fbfaf7] text-[#5c554d] border-[#dfd9cf]'}">${t.label}</button>`).join("")}
                </div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-[#f0ece3]">
              <span class="text-[10px] tracking-[0.18em] uppercase text-[#7a7166] font-semibold">LIVE PRESETS:</span>
              ${[
                "https://www.contextmuse.com",
                "https://mapswithteeth.org",
                "https://jaymevolstad.com",
                "https://howtoexplainyourselftowolves.com"
              ].map(u => `<button onclick="window.scanPreset('${u}')" class="px-3 py-1 text-[10px] font-mono border cursor-pointer ${state.url === u ? 'bg-[#141312] text-white border-[#141312]' : 'bg-[#fbfaf7] text-[#5c554d] border-[#dfd9cf]'}">${u.replace(/^https?:\/\/(www\.)?/,'')}</button>`).join("")}
            </div>
          </section>

          <!-- 2. THREE FULL-SCREEN CONCEPT PROTOTYPE LAUNCHERS -->
          <section class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 border-b border-[#dfd9cf] pb-4">
              <div>
                <span class="text-[10px] tracking-[0.22em] uppercase text-[#be2623] font-semibold block">PLAYABLE FULL-SCREEN REBUILDS OF ${h.hostname.toUpperCase()}</span>
                <h2 class="font-sans font-light text-2xl sm:text-4xl tracking-[-0.035em]">Launch the 3 Re-Architected Concept Directions</h2>
              </div>
              <span class="text-[11px] tracking-[0.18em] uppercase text-emerald-800 font-semibold">LENS: ${r.intentLabel.toUpperCase()}</span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-stretch">
              ${r.directions.map((d, idx) => `
                <div class="bg-white border-2 border-[#141312] flex flex-col justify-between shadow-md group">
                  <div>
                    <button onclick="window.launchConcept('concept-${d.id}')" class="block w-full text-left relative h-52 overflow-hidden bg-[#141312] border-b border-[#dfd9cf] cursor-pointer">
                      <img src="${h.harvestedImages[idx % h.harvestedImages.length]}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 opacity-90" />
                      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                      <div class="absolute top-3 left-3 bg-[#be2623] text-white px-3 py-1 text-[10px] tracking-[0.2em] uppercase font-bold">${d.code}</div>
                      <div class="absolute bottom-3 left-3 right-3 text-white">
                        <span class="font-mono text-[10px] uppercase tracking-widest text-amber-300 block">${d.archetype}</span>
                        <span class="font-sans text-lg font-light">${d.name}</span>
                      </div>
                    </button>

                    <div class="p-6 space-y-4">
                      <div class="p-3 bg-[#fbfaf7] border-l-2 border-[#be2623] text-xs font-serif">
                        <strong class="font-sans text-[10px] uppercase tracking-wider text-[#be2623] block">HARVESTED &amp; REBUILT H1:</strong>
                        “${d.headline}”
                      </div>
                      <p class="font-serif text-sm text-[#2e2a27] leading-relaxed"><strong class="font-sans text-[10px] uppercase tracking-wider">Opening Viewport:</strong> ${d.openingSpec}</p>
                      <p class="font-serif text-sm text-[#2e2a27] leading-relaxed"><strong class="font-sans text-[10px] uppercase tracking-wider text-[#be2623]">Interactive State I → II:</strong> ${d.mechanic}</p>
                      <p class="font-serif italic text-xs text-[#5c554d]">${d.whyItWorks}</p>
                    </div>
                  </div>

                  <div class="p-6 pt-0">
                    <button onclick="window.launchConcept('concept-${d.id}')" class="w-full py-4 px-5 bg-[#be2623] hover:bg-[#141312] text-white transition-colors text-[11px] tracking-[0.2em] uppercase font-bold cursor-pointer flex items-center justify-between shadow-md">
                      <span>▶ LAUNCH FULL-SCREEN CONCEPT ${d.id}</span>
                      <span>→</span>
                    </button>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>

          <!-- 3. DIAGNOSTIC AUDIT -->
          <section class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 border-b border-[#dfd9cf] pb-4">
              <h2 class="font-sans font-light text-2xl sm:text-3xl tracking-[-0.03em]">I. Diagnostic Audit of <strong>${h.hostname}</strong></h2>
              <span class="text-[10px] tracking-[0.2em] uppercase text-[#be2623] font-semibold">BOX FATIGUE: ${r.boxScore}/100 (${h.containerCount} CONTAINERS) · FONTS: ${h.detectedFonts.join(", ")}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 font-serif text-sm sm:text-base leading-relaxed">
              <div class="bg-white border border-[#dfd9cf] p-6 sm:p-8 space-y-3">
                <span class="font-sans text-[10px] tracking-[0.2em] uppercase font-semibold text-emerald-800 block border-b border-[#ece7df] pb-2">01 · WHAT DESERVES PRESERVATION</span>
                <p><strong>Core Domain Premise:</strong> “${h.primaryHeadline}” carries real authority that deserves an unboxed architectural stage.</p>
                <p><strong>Harvested Section Anchors:</strong> (${h.secondaryHeadlines.slice(0,3).join(" · ")}) provide a strong conceptual spine once converted into interactive nodes.</p>
              </div>
              <div class="bg-white border border-[#dfd9cf] p-6 sm:p-8 space-y-3">
                <span class="font-sans text-[10px] tracking-[0.2em] uppercase font-semibold text-[#be2623] block border-b border-[#ece7df] pb-2">02 · WHAT IS UNSUCCESSFUL</span>
                <p><strong>Container &amp; Box Fatigue (${r.boxScore}/100):</strong> ${h.containerCount} bordered/boxed containers make high-conviction proof read like template filler.</p>
                <p><strong>Over-Explanation Above the Fold:</strong> Summarizes everything in State I static text before earning visual curiosity.</p>
              </div>
              <div class="bg-white border border-[#dfd9cf] p-6 sm:p-8 space-y-3">
                <span class="font-sans text-[10px] tracking-[0.2em] uppercase font-semibold text-amber-800 block border-b border-[#ece7df] pb-2">03 · WHAT IS LIMITING THE DESIGN</span>
                <p><strong>Single-State Static Sections:</strong> Visitors scroll passively instead of pulling a datum seam, unstitching a claim, or warping a coordinate survey.</p>
                <p><strong>Category-Blind Grammar:</strong> Needs mechanics built specifically for <em>${r.intentLabel}</em>.</p>
              </div>
            </div>
          </section>
        </main>
      `;
    }

    // Global handlers for inline controls
    window.onScanSubmit = (e) => {
      e.preventDefault();
      const val = document.getElementById("input-url").value;
      harvestAndCompile(val);
    };
    window.scanPreset = (u) => {
      state.intentLens = "auto";
      harvestAndCompile(u);
    };
    window.setIntent = (id) => {
      state.intentLens = id;
      compileReport();
    };
    window.setTone = (id) => {
      state.nuanceTone = id;
      compileReport();
    };
    window.launchConcept = (mode) => setViewMode(mode);
    window.toggleProtoState = () => {
      state.protoStateTwo = !state.protoStateTwo;
      render();
    };
    window.setPlate = (idx) => {
      state.activePlateIdx = idx;
      render();
    };
    window.selectPin = (idx) => {
      state.activePinIdx = idx;
      state.protoStateTwo = true;
      render();
    };
    window.toggleUnstitch = (idx) => {
      if (state.unstitchedIndices.includes(idx)) {
        state.unstitchedIndices = state.unstitchedIndices.filter(x => x !== idx);
      } else {
        state.unstitchedIndices.push(idx);
      }
      render();
    };
    window.toggleAllUnstitch = () => {
      const len = state.report.directions[1].modules.length;
      state.unstitchedIndices = state.unstitchedIndices.length === len ? [] : [0, 1, 2];
      render();
    };
    window.setAtlasDistortion = (val) => {
      state.atlasDistortion = val;
      render();
    };
    window.selectLocus = (idx) => {
      state.selectedLocusIdx = idx;
      state.atlasDistortion = 100;
      render();
    };

    document.querySelectorAll(".view-btn").forEach((btn) => {
      btn.addEventListener("click", () => setViewMode(btn.getAttribute("data-view")));
    });

    document.getElementById("btn-toggle-guidance").addEventListener("click", (e) => {
      state.showGuidance = !state.showGuidance;
      e.currentTarget.textContent = "🧭 GUIDANCE NOTES: " + (state.showGuidance ? "ON" : "OFF");
      render();
    });

    document.getElementById("btn-export-html").addEventListener("click", () => {
      if (!state.harvested || !state.report) return;
      const blob = new Blob([document.documentElement.outerHTML], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "contextmuse-auditstudio-" + state.harvested.hostname + ".html";
      a.click();
      URL.revokeObjectURL(url);
    });

    // Initial load
    const params = new URLSearchParams(window.location.search);
    if (params.get("site")) state.url = params.get("site");
    if (params.get("intent")) state.intentLens = params.get("intent");
    if (params.get("tone")) state.nuanceTone = params.get("tone");
    harvestAndCompile(state.url);
  </script>
</body>
</html>
