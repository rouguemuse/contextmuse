    async function harvestAndCompile(targetUrl) {
      let raw = targetUrl.trim();
      if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
      state.url = raw;

      let harvested = null;
      try {
        const res = await fetch("/api/auditstudio", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: raw })
        });
        if (res.ok) harvested = await res.json();
      } catch (e) {}

      if (!harvested || !harvested.hostname) {
        const u = new URL(raw);
        const host = u.hostname.replace(/^www\./, "");
        harvested = {
          targetUrl: raw,
          hostname: host,
          httpStatus: 200,
          ttfbMs: 240,
          siteTitle: host + " — Architectural Teardown",
          primaryHeadline: host.includes("contextmuse")
            ? "Decision-Grade Intelligence & High-Conviction Systems"
            : host.includes("mapswithteeth")

                  <p class="font-serif text-sm sm:text-base text-[#d8d2c9] leading-relaxed">A comprehensive, living diagnostic report with category scores, live DOM evidence, plain-English recommendations, self-serve quick wins, and 3 playable full-screen concept rebuilds of <strong>${h.hostname}</strong>.</p>
                  <ul class="space-y-2 text-xs font-mono text-[#cfc8bc] pt-2 border-t border-[#2c2926]">
                    <li>✓ Four-category SEO, structure, content intent &amp; UX evaluation</li>
                    <li>✓ Specific affected pages &amp; plain-English recommendations</li>
                    <li>✓ Self-serve quick wins your team can complete immediately</li>
                    <li>✓ 3 playable full-screen Concept Rebuilds (Concepts A, B &amp; C)</li>
                  </ul>
                </div>
                <div class="pt-4 border-t border-[#2c2926] flex items-center justify-between text-xs font-mono">
                  <span class="text-emerald-400">STATUS: LIVING RECORD ACTIVE</span>
                  <button onclick="document.getElementById('btn-export-html').click()" class="px-4 py-2 bg-[#fbfaf7] text-[#141312] font-bold uppercase tracking-[0.16em] text-[10px] cursor-pointer hover:bg-amber-300 transition-colors">
                    EXPORT DIAGNOSTIC (.HTML) →
                  </button>
                </div>
              </div>

              <!-- OFFER 2: WEBSITE IMPROVEMENT PACKAGE -->
              <div class="bg-[#1e1c1a] border-2 border-[#be2623] p-6 sm:p-8 flex flex-col justify-between space-y-6">
                <div class="space-y-4">
                  <div class="flex items-center justify-between">
                    <span class="px-2.5 py-1 bg-[#be2623] text-white text-[10px] font-mono uppercase tracking-[0.18em] font-bold">PURCHASE 02 · IMPLEMENTATION &amp; VERIFICATION</span>
                    <span class="font-mono text-xs uppercase text-amber-300">FIXED START · SCOPED QUOTE</span>
                  </div>
                  <h3 class="font-sans text-2xl font-light tracking-[-0.02em] text-white">2. Website Improvement Package</h3>
                  <p class="font-serif text-sm sm:text-base text-[#d8d2c9] leading-relaxed">Hire Context &amp; Muse to execute your selected improvements—including researched SEO titles/descriptions, Schema.org JSON-LD, messaging &amp; navigation refactors, and full conversion architecture implementation.</p>
                  <div class="p-4 bg-[#141312] border border-[#3a3632] space-y-2">
                    <span class="text-[10px] font-mono uppercase tracking-[0.16em] text-amber-300 block">CURRENTLY APPROVED FOR IMPLEMENTATION (${approvedFindings.length}):</span>
                    ${approvedFindings.length === 0 ? `
                      <p class="font-serif italic text-xs text-[#a89f93]">Click “+ APPROVE FOR IMPROVEMENT” on any finding above to add it to your implementation scope.</p>
                    ` : `
                      <ul class="space-y-1.5 text-xs font-mono text-[#fbfaf7]">
                        ${approvedFindings.map(af => `
                          <li class="flex items-center justify-between gap-2">
                            <span class="truncate">● ${af.headline}</span>
                            <span class="text-amber-300 shrink-0">${af.availableServiceTitle.replace("Available service: ", "")}</span>
                          </li>
                        `).join("")}
                      </ul>
                    `}
                  </div>
                </div>
                <div class="pt-4 border-t border-[#2c2926] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <span class="text-[11px] font-serif italic text-[#cfc8bc]">Every implemented fix is moved to <strong>Verified after implementation</strong> in this record.</span>
                  <a href="https://www.contextmuse.com/#inquire" class="px-5 py-3 bg-[#be2623] hover:bg-amber-400 hover:text-[#141312] text-white font-mono text-[10px] uppercase tracking-[0.18em] font-bold text-center transition-colors shrink-0">
                    SCOPE IMPROVEMENT PACKAGE →
                  </a>
                </div>
              </div>
            </div>
          </section>
        </main>
      `;
    }

    // Global handlers for inline controls
    window.onScanSubmit = (e) => {
      e.preventDefault();
      const val = document.getElementById("input-url").value;
      harvestAndCompile(val);
    };
    window.scanPreset = (u) => {
      state.intentLens = "auto";
      harvestAndCompile(u);
    };
    window.setIntent = (id) => {
      state.intentLens = id;
      compileReport();
    };
    window.setTone = (id) => {
      state.nuanceTone = id;
      compileReport();
    };
    window.setCategoryFilter = (catId) => {
      state.activeCategoryFilter = catId;
      render();
    };
    window.setFindingStatus = (findingId, status) => {
      state.findingStatusMap[findingId] = status;
      render();
    };
    window.setWorkspaceMode = (mode) => {
      state.workspaceMode = mode;
      render();
    };
    window.setProductTier = (tier) => {
      state.activeProductTier = tier;
      render();
    };
    window.setClientName = (name) => {
      state.clientName = name;
      render();
    };
    window.moveBlock = (idx, delta) => {
      const target = idx + delta;
      if (target < 0 || target >= state.sectionOrder.length) return;
      const arr = [...state.sectionOrder];
      const tmp = arr[idx];
      arr[idx] = arr[target];
      arr[target] = tmp;
      state.sectionOrder = arr;
      render();
    };
    window.printClientPdf = () => {
      state.workspaceMode = "CLIENT_REPORT";
      render();
      setTimeout(() => window.print(), 150);
    };
    window.launchConcept = (mode) => setViewMode(mode);
    window.toggleProtoState = () => {
      state.protoStateTwo = !state.protoStateTwo;
      render();
    };
    window.setPlate = (idx) => {
      state.activePlateIdx = idx;
      render();
    };
    window.selectPin = (idx) => {
      state.activePinIdx = idx;
      state.protoStateTwo = true;
      render();
    };
    window.toggleUnstitch = (idx) => {
      if (state.unstitchedIndices.includes(idx)) {
        state.unstitchedIndices = state.unstitchedIndices.filter(x => x !== idx);
      } else {
        state.unstitchedIndices.push(idx);
      }
      render();
    };
    window.toggleAllUnstitch = () => {
      const len = state.report.directions[1].modules.length;
      state.unstitchedIndices = state.unstitchedIndices.length === len ? [] : [0, 1, 2];
      render();
    };
    window.setAtlasDistortion = (val) => {
      state.atlasDistortion = val;
      render();
    };
    window.selectLocus = (idx) => {
      state.selectedLocusIdx = idx;
      state.atlasDistortion = 100;
      render();
    };

    document.querySelectorAll(".view-btn").forEach((btn) => {
      btn.addEventListener("click", () => setViewMode(btn.getAttribute("data-view")));
    });

    document.getElementById("btn-toggle-guidance").addEventListener("click", (e) => {
      state.showGuidance = !state.showGuidance;
      e.currentTarget.textContent = "🧭 GUIDANCE NOTES: " + (state.showGuidance ? "ON" : "OFF");
      render();
    });

    document.getElementById("btn-export-html").addEventListener("click", () => {
      if (!state.harvested || !state.report) return;
      const blob = new Blob([document.documentElement.outerHTML], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "contextmuse-auditstudio-" + state.harvested.hostname + ".html";
      a.click();
      URL.revokeObjectURL(url);
    });

    // Initial load
    const params = new URLSearchParams(window.location.search);
    if (params.get("site")) state.url = params.get("site");
    if (params.get("intent")) state.intentLens = params.get("intent");
    if (params.get("tone")) state.nuanceTone = params.get("tone");
    harvestAndCompile(state.url);
  </script>
</body>
</html>
